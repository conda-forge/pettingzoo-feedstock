{% set name = "pettingzoo" %}
{% set version = "1.26.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pettingzoo-{{ version }}.tar.gz
  sha256: 1bae0c7d3c51bf032f2e2abb589b211feec786de76cbbff87f8189ad51649820

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.21.0
    - gymnasium >=0.28.0

test:
  imports:
    - pettingzoo
    - pettingzoo.test
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pettingzoo.farama.org/
  doc_url: https://pettingzoo.farama.org/
  dev_url: https://github.com/Farama-Foundation/PettingZoo
  summary: Gymnasium for multi-agent reinforcement learning.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kellend-git
